syntax = "proto3";

option csharp_namespace = "Core.Server.IPC";

package character;

service CharacterService {
  rpc GetCharacterList (CharacterListRequest) returns (CharacterListResponse);
  rpc CreateCharacter (CreateCharacterRequest) returns (CreateCharacterResponse);
  rpc DeleteCharacter (DeleteCharacterRequest) returns (DeleteCharacterResponse);
  rpc GetCharacterData (CharacterDataRequest) returns (CharacterDataResponse);
  rpc IssueMapAuthTicket (MapAuthTicketRequest) returns (MapAuthTicketResponse);
  rpc ConsumeMapAuthTicket (MapAuthConsumeRequest) returns (MapAuthConsumeResponse);
  rpc ForceDisconnectAccount (ForceDisconnectAccountRequest) returns (ForceDisconnectAccountResponse);
}

message CharacterListRequest {
  int64 account_id = 1;
}

message CharacterInfo {
  int64 character_id = 1;
  string name = 2;
  int32 level = 3;
  int32 class_id = 4;
  int64 created_at = 5;
}

message CharacterListResponse {
  repeated CharacterInfo characters = 1;
}

message CreateCharacterRequest {
  int64 account_id = 1;
  string name = 2;
  int32 class_id = 3;
}

message CreateCharacterResponse {
  bool success = 1;
  string error_message = 2;
  CharacterInfo character = 3;
}

message DeleteCharacterRequest {
  int64 character_id = 1;
  int64 account_id = 2;
}

message DeleteCharacterResponse {
  bool success = 1;
}

message CharacterDataRequest {
  int64 character_id = 1;
}

message CharacterDataResponse {
  CharacterInfo character = 1;
  int32 map_id = 2;
  float position_x = 3;
  float position_y = 4;
  float position_z = 5;
}

// Char->Map handoff ticket (rAthena chmapif auth flow equivalent)
message MapAuthTicketRequest {
  int32 account_id = 1;
  int64 character_id = 2;
  int32 login_id1 = 3;
  int32 login_id2 = 4;
  uint32 sex = 5;
  uint32 client_type = 6;
  int32 ttl_seconds = 7;
}

message MapAuthTicketResponse {
  bool success = 1;
  string error_message = 2;
}

message MapAuthConsumeRequest {
  int32 account_id = 1;
  int64 character_id = 2;
  int32 login_id1 = 3;
  int32 login_id2 = 4;
}

message MapAuthConsumeResponse {
  bool success = 1;
  string error_message = 2;
  uint32 sex = 3;
  uint32 client_type = 4;
}

message ForceDisconnectAccountRequest {
  int32 account_id = 1;
}

message ForceDisconnectAccountResponse {
  bool success = 1;
  int32 disconnected_sessions = 2;
}
