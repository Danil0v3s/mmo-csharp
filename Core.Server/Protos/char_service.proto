  rpc MercenaryLoad (MercenaryLoadRequest) returns (MercenaryLoadResponse);
  rpc MercenarySave (MercenarySaveRequest) returns (MercenarySaveResponse);
  rpc MercenaryDelete (MercenaryDeleteRequest) returns (MercenaryDeleteResponse);
