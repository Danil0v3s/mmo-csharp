message CharacterListRequest {
  int64 account_id = 1;
}

message CharacterInfo {
  int64 character_id = 1;
  string name = 2;
  int32 level = 3;
  int32 class_id = 4;
  int64 created_at = 5;
}

message CharacterListResponse {
  repeated CharacterInfo characters = 1;
}

message CreateCharacterRequest {
  int64 account_id = 1;
  string name = 2;
  int32 class_id = 3;
}

message CreateCharacterResponse {
  bool success = 1;
  string error_message = 2;
  CharacterInfo character = 3;
}

message DeleteCharacterRequest {
  int64 character_id = 1;
  int64 account_id = 2;
}

message DeleteCharacterResponse {
  bool success = 1;
}

message CharacterDataRequest {
  int64 character_id = 1;
}

message CharacterDataResponse {
  CharacterInfo character = 1;
  int32 map_id = 2;
  float position_x = 3;
  float position_y = 4;
  float position_z = 5;
  // rAthena's last_point.map name (e.g. "prontera"). The map_id field is
  // an opaque integer with no shared lookup table yet; map servers
  // resolve the spawn map by name via IMapWorldRegistry.
  string map_name = 6;

  // Saved status fields needed by the map server's initial-status
  // broadcast cascade (see .agents/migrations/map/initial-status-broadcast.md).
  // Mirror rAthena `struct mmo_charstatus` for the renewal-stat subset
  // that the broadcast emits. Stats are uint32 to fit the SQL column
  // shape; 4th-job stats are uint16 to mirror the C struct.
  uint32 str = 7;
  uint32 agi = 8;
  uint32 vit = 9;
  uint32 int_stat = 10;
  uint32 dex = 11;
  uint32 luk = 12;
  uint32 status_point = 13;
  uint32 skill_point = 14;
  uint32 base_level = 15;
  uint32 job_level = 16;
  uint64 base_exp = 17;
  uint64 job_exp = 18;
  uint64 hp = 19;
  uint64 max_hp = 20;
  uint64 sp = 21;
  uint64 max_sp = 22;
  uint32 zeny = 23;
  uint32 class_id = 24;
  uint32 weapon = 25;
  uint32 shield = 26;
  // 4th-job (renewal trait) stats — all-zero for pre-4th-job characters.
  uint32 pow = 27;
  uint32 sta = 28;
  uint32 wis = 29;
  uint32 spl = 30;
  uint32 con = 31;
  uint32 crt = 32;
  uint32 trait_point = 33;
  uint32 ap = 34;
  uint32 max_ap = 35;
}

// rAthena parity for chmapif_parse_reqchangemapserv (0x2b05)
message MapServerChangeRequest {
  int32 account_id = 1;
  int64 character_id = 2;
  int32 login_id1 = 3;
  int32 login_id2 = 4;
  uint32 sex = 5;
  uint32 client_type = 6;
  string map_name = 7;
  uint32 x = 8;
  uint32 y = 9;
  int32 target_map_server_id = 10;
  uint32 client_ip = 11;
  uint32 group_id = 12;
  int32 ttl_seconds = 13;
}

message MapServerChangeResponse {
  bool success = 1;
  string error_message = 2;
}

// rAthena parity for chmapif_parse_reqauth (0x2b26)
message CharacterMapAuthRequest {
  int32 account_id = 1;
  int64 character_id = 2;
  int32 login_id1 = 3;
  int32 login_id2 = 4;
  uint32 sex = 5;
  uint32 ip = 6;
  bool autotrade = 7;
}

message CharacterMapAuthResponse {
  bool success = 1;
  string error_message = 2;
  int32 account_id = 3;
  int64 character_id = 4;
  int32 login_id1 = 5;
  int32 login_id2 = 6;
  int64 expiration_time = 7;
  uint32 group_id = 8;
  bool changing_map_servers = 9;
  CharacterDataResponse character_data = 10;
  // Authoritative sex from the auth ticket (or DB on autotrade). The
  // CZ_WANT_TO_CONNECTION sex byte the client sends is unreliable across
  // PACKETVERs — using this avoids a downstream mismatch when we later
  // pre-register the player on char-server for char-select-back.
  // 0 = female, 1 = male.
  uint32 sex = 11;
}

// rAthena parity for chmapif_parse_reqsavechar (0x2b01)
message SaveCharacterStateRequest {
  int32 account_id = 1;
  int64 character_id = 2;
  bool set_offline_after_save = 3;
  bool final_save = 4;
}

message SaveCharacterStateResponse {
  bool success = 1;
  string error_message = 2;
  bool save_ack = 3;
}

// rAthena parity for chmapif_parse_authok (0x2b02)
message CharacterSelectAuthOkRequest {
  int32 account_id = 1;
  int32 login_id1 = 2;
  int32 login_id2 = 3;
  uint32 ip = 4;
  // Player sex, needed for the returning-client auth match on char-server
  // (same byte the client sends in CH_REQ_TO_CONNECT). 0 = female, 1 = male.
  uint32 sex = 5;
}

message CharacterSelectAuthOkResponse {
  bool success = 1;
  string error_message = 2;
}

// rAthena parity for chmapif_parse_keepalive (0x2b23)
message CharacterKeepAliveRequest {}

message CharacterKeepAliveResponse {
  bool success = 1;
}

