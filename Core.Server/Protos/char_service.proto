syntax = "proto3";

option csharp_namespace = "Core.Server.IPC";

package character;

service CharacterService {
  rpc GetCharacterList (CharacterListRequest) returns (CharacterListResponse);
  rpc CreateCharacter (CreateCharacterRequest) returns (CreateCharacterResponse);
  rpc DeleteCharacter (DeleteCharacterRequest) returns (DeleteCharacterResponse);
  rpc GetCharacterData (CharacterDataRequest) returns (CharacterDataResponse);
  rpc RequestMapServerChange (MapServerChangeRequest) returns (MapServerChangeResponse);
  rpc RequestCharacterMapAuth (CharacterMapAuthRequest) returns (CharacterMapAuthResponse);
  rpc SaveCharacterState (SaveCharacterStateRequest) returns (SaveCharacterStateResponse);
  rpc NotifyCharacterSelectAuthOk (CharacterSelectAuthOkRequest) returns (CharacterSelectAuthOkResponse);
  rpc KeepAlive (CharacterKeepAliveRequest) returns (CharacterKeepAliveResponse);
  rpc IssueMapAuthTicket (MapAuthTicketRequest) returns (MapAuthTicketResponse);
  rpc ConsumeMapAuthTicket (MapAuthConsumeRequest) returns (MapAuthConsumeResponse);
  rpc ForceDisconnectAccount (ForceDisconnectAccountRequest) returns (ForceDisconnectAccountResponse);
  rpc BroadcastAccountStatusUpdate (AccountStatusBroadcastRequest) returns (AccountStatusBroadcastResponse);
  rpc BroadcastAccountSexUpdate (AccountSexBroadcastRequest) returns (AccountSexBroadcastResponse);
  rpc RequestAddressSync (AddressSyncRequest) returns (AddressSyncResponse);
  rpc PushVipData (AccountVipPushRequest) returns (AccountVipPushResponse);
  rpc RegisterMapServerMaps (MapServerMapRegistryRequest) returns (MapServerMapRegistryResponse);
  rpc GetMapServerUserCount (MapServerUserCountRequest) returns (MapServerUserCountResponse);
  rpc RegisterMapServerUserCount (MapServerUserCountUpdateRequest) returns (MapServerUserCountUpdateResponse);
  rpc UpdateMapServerAddress (MapServerAddressUpdateRequest) returns (MapServerAddressUpdateResponse);
  rpc RequestStatusChangeData (StatusChangeDataRequest) returns (StatusChangeDataResponse);
  rpc SaveStatusChangeData (StatusChangeDataSaveRequest) returns (StatusChangeDataSaveResponse);
  rpc LoadSkillCooldown (SkillCooldownLoadRequest) returns (SkillCooldownLoadResponse);
  rpc SaveSkillCooldown (SkillCooldownSaveRequest) returns (SkillCooldownSaveResponse);
  rpc SetCharacterOffline (CharacterOnlineStateRequest) returns (CharacterOnlineStateResponse);
  rpc SetCharacterOnline (CharacterOnlineStateRequest) returns (CharacterOnlineStateResponse);
  rpc SetAllCharactersOffline (SetAllCharactersOfflineRequest) returns (SetAllCharactersOfflineResponse);
  rpc RequestRemoveFriend (RemoveFriendRequest) returns (RemoveFriendResponse);
  rpc RequestCharacterName (CharacterNameRequest) returns (CharacterNameResponse);
  rpc RequestEmailChange (CharacterEmailChangeRequest) returns (CharacterEmailChangeResponse);
  rpc ForwardAccountStatusChange (ForwardAccountStatusChangeRequest) returns (ForwardAccountStatusChangeResponse);
  rpc RequestDivorce (DivorceRequest) returns (DivorceResponse);
  rpc RequestCharacterBan (CharacterBanRequest) returns (CharacterBanResponse);
  rpc RequestCharacterUnban (CharacterUnbanRequest) returns (CharacterUnbanResponse);
  rpc UpdateFame (FameUpdateRequest) returns (FameUpdateResponse);
  rpc RequestFameList (FameListRequest) returns (FameListResponse);
  rpc GetBonusScript (BonusScriptGetRequest) returns (BonusScriptGetResponse);
  rpc SaveBonusScript (BonusScriptSaveRequest) returns (BonusScriptSaveResponse);
  rpc InterBroadcast (InterBroadcastRequest) returns (InterBroadcastResponse);
  rpc InterBroadcastItem (InterBroadcastItemRequest) returns (InterBroadcastItemResponse);
  rpc InterWhisper (InterWhisperRequest) returns (InterWhisperResponse);
  rpc InterWhisperReply (InterWhisperReplyRequest) returns (InterWhisperReplyResponse);
  rpc InterWhisperToGm (InterWhisperToGmRequest) returns (InterWhisperToGmResponse);
  rpc InterRegistryUpdate (InterRegistryUpdateRequest) returns (InterRegistryUpdateResponse);
  rpc InterRegistryFetch (InterRegistryFetchRequest) returns (InterRegistryFetchResponse);
  rpc InterNameChange (InterNameChangeRequest) returns (InterNameChangeResponse);
  rpc InterAccountInfo (InterAccountInfoRequest) returns (InterAccountInfoResponse);
  rpc PartyCreate (PartyCreateRequest) returns (PartyCreateResponse);
  rpc PartyInfo (PartyInfoRequest) returns (PartyInfoResponse);
  rpc PartyAddMember (PartyAddMemberRequest) returns (PartyAddMemberResponse);
  rpc PartyChangeOption (PartyChangeOptionRequest) returns (PartyChangeOptionResponse);
  rpc PartyLeave (PartyLeaveRequest) returns (PartyLeaveResponse);
  rpc PartyChangeMap (PartyChangeMapRequest) returns (PartyChangeMapResponse);
  rpc PartyBreak (PartyBreakRequest) returns (PartyBreakResponse);
  rpc PartyMessage (PartyMessageRequest) returns (PartyMessageResponse);
  rpc PartyLeaderChange (PartyLeaderChangeRequest) returns (PartyLeaderChangeResponse);
  rpc PartyShareLevel (PartyShareLevelRequest) returns (PartyShareLevelResponse);
  rpc GuildCreate (GuildCreateRequest) returns (GuildCreateResponse);
  rpc GuildInfo (GuildInfoRequest) returns (GuildInfoResponse);
  rpc GuildAddMember (GuildAddMemberRequest) returns (GuildAddMemberResponse);
  rpc GuildMasterChange (GuildMasterChangeRequest) returns (GuildMasterChangeResponse);
  rpc GuildLeave (GuildLeaveRequest) returns (GuildLeaveResponse);
  rpc GuildChangeMemberInfoShort (GuildChangeMemberInfoShortRequest) returns (GuildChangeMemberInfoShortResponse);
  rpc GuildBreak (GuildBreakRequest) returns (GuildBreakResponse);
  rpc GuildMessage (GuildMessageRequest) returns (GuildMessageResponse);
  rpc GuildBasicInfoChange (GuildBasicInfoChangeRequest) returns (GuildBasicInfoChangeResponse);
  rpc GuildMemberInfoChange (GuildMemberInfoChangeRequest) returns (GuildMemberInfoChangeResponse);
