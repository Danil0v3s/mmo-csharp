  rpc AuctionClose (AuctionCloseRequest) returns (AuctionCloseResponse);
  rpc AuctionBid (AuctionBidRequest) returns (AuctionBidResponse);
  rpc QuestLoad (QuestLoadRequest) returns (QuestLoadResponse);
  rpc QuestSave (QuestSaveRequest) returns (QuestSaveResponse);
  rpc HotkeyLoad (HotkeyLoadRequest) returns (HotkeyLoadResponse);
  rpc HotkeySave (HotkeySaveRequest) returns (HotkeySaveResponse);
  rpc AchievementLoad (AchievementLoadRequest) returns (AchievementLoadResponse);
  rpc AchievementSave (AchievementSaveRequest) returns (AchievementSaveResponse);
  rpc AchievementReward (AchievementRewardRequest) returns (AchievementRewardResponse);
  rpc PetCreate (PetCreateRequest) returns (PetCreateResponse);
  rpc PetLoad (PetLoadRequest) returns (PetLoadResponse);
  rpc PetSave (PetSaveRequest) returns (PetSaveResponse);
  rpc PetDelete (PetDeleteRequest) returns (PetDeleteResponse);
  rpc HomunculusCreate (HomunculusCreateRequest) returns (HomunculusCreateResponse);
  rpc HomunculusLoad (HomunculusLoadRequest) returns (HomunculusLoadResponse);
  rpc HomunculusSave (HomunculusSaveRequest) returns (HomunculusSaveResponse);
  rpc HomunculusDelete (HomunculusDeleteRequest) returns (HomunculusDeleteResponse);
